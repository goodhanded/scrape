apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-scraper
  template:
    metadata:
      labels:
        app: web-scraper
    spec:
      containers:
      - name: web-scraper
        image: web-scraper:latest
        ports:
        - containerPort: 8000
